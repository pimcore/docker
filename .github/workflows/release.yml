name: Docker Build & Release

on:
    workflow_dispatch:
        inputs:
            publish:
                description: 'Publish images to registries'
                required: false
                default: true
                type: boolean
            publish_hardened:
                description: 'Also publish the Copa-hardened (-hardened) tags. Requires publish=true. Off by default so hardened stays unpublished (built + scanned + gated but not pushed) on scheduled/tag runs and during testing, until explicitly enabled on a manual dispatch.'
                required: false
                default: false
                type: boolean
            fail_on_severity:
                description: 'Severity THRESHOLD for the post-patch gate: naming a severity also gates everything above it (e.g. HIGH gates HIGH,CRITICAL). Case-insensitive. Valid values: UNKNOWN, LOW, MEDIUM, HIGH, CRITICAL (or a comma-separated set — the lowest one wins). Use NONE to disable the gate entirely.'
                required: false
                default: 'CRITICAL,HIGH'
                type: string
    push:
        tags:
            - 'v*.*'
    schedule:
        -   cron: '30 2 * * 1,3,5'

env:
    IMAGE_NAME: pimcore/pimcore
    COPA_VERSION: "0.14.1"
    ORAS_VERSION: "1.2.0"
    TRIVY_DB_REPOSITORY: "ghcr.io/aquasecurity/trivy-db:2"
    TRIVY_JAVA_DB_REPOSITORY: "ghcr.io/aquasecurity/trivy-java-db:1"

jobs:
    build-php:
        name: "Build PHP images"
        runs-on: ${{ matrix.runner }}
        if: github.repository == 'pimcore/docker'
        strategy:
            fail-fast: false
            matrix:
                runner:
                    - ubuntu-22.04
                    - ubuntu-22.04-arm
                build:
                    - { tag: 'v2.3', php: '8.2', distro: bullseye, version-override: "", latest-tag: false, hardened: true }
                    - { tag: '2.x', php: '8.2', distro: bullseye, version-override: "v2-dev", latest-tag: false, hardened: false }
                    - { tag: 'v3.8', php: '8.2', distro: bookworm, version-override: "", latest-tag: true, hardened: true }
                    - { tag: 'v3.8', php: '8.3', distro: bookworm, version-override: "", latest-tag: true, hardened: true }
                    - { tag: '3.x', php: '8.2', distro: bookworm, version-override: "v3-dev", latest-tag: false, hardened: false }
                    - { tag: '3.x', php: '8.3', distro: bookworm, version-override: "v3-dev", latest-tag: false, hardened: false }
                    - { tag: 'v4.2', php: '8.4', distro: bookworm, version-override: "", latest-tag: true, hardened: true }
                    - { tag: '4.x', php: '8.4', distro: bookworm, version-override: "v4-dev", latest-tag: false, hardened: false }
                    - { tag: 'v5.2', php: '8.5', distro: trixie, version-override: "", latest-tag: true, hardened: true }
                    - { tag: '5.x', php: '8.5', distro: trixie, version-override: "v5-dev", latest-tag: false, hardened: false }

        steps:
            -   uses: actions/checkout@v5
                with:
                    ref: ${{ matrix.build.tag }}

            # The build ref above (matrix.build.tag) is a release branch/tag that predates
            # this pipeline and does NOT contain .github/scripts. Check the CI scripts out
            # separately from the workflow's own commit (github.sha) into _ci/ so the steps
            # below can call them regardless of which build ref is checked out into the root.
            -   name: Check out CI scripts from the workflow ref
                uses: actions/checkout@v5
                with:
                    path: _ci
                    sparse-checkout: .github/scripts
                    sparse-checkout-cone-mode: false

            -   name: Enable containerd image store
                if: ${{ matrix.build.hardened }}
                run: |
                    set -euxo pipefail
                    # Copa's mergeop/diffop (required to patch) are only available with the
                    # containerd image store backend, which also gives dockerd's embedded
                    # BuildKit a shared image store. With it enabled, Copa's default connection
                    # patches the locally built plain image -- no registry round-trip and no
                    # standalone buildkitd. Enable it on the hardened legs only, before any
                    # builder is created (this restarts the daemon).
                    sudo mkdir -p /etc/docker
                    if [ -s /etc/docker/daemon.json ]; then
                        existing="$(sudo cat /etc/docker/daemon.json)"
                    else
                        existing='{}'
                    fi
                    printf '%s' "$existing" \
                        | jq '.features = ((.features // {}) + {"containerd-snapshotter": true})' \
                        | sudo tee /etc/docker/daemon.json >/dev/null
                    sudo systemctl restart docker
                    # Wait for the daemon to come back up.
                    for i in $(seq 1 30); do
                        if docker info >/dev/null 2>&1; then break; fi
                        if [ "$i" -eq 30 ]; then
                            echo "::error::Docker did not come back after restart"
                            exit 1
                        fi
                        sleep 1
                    done
                    # Verify the containerd snapshotter storage backend is active.
                    if ! docker info | grep -q 'io.containerd.snapshotter'; then
                        echo "::error::containerd image store is not active after restart"
                        docker info || true
                        exit 1
                    fi

            -   name: Set up Docker Buildx
                uses: docker/setup-buildx-action@v4

            -   name: Login to DockerHub Registry
                run: echo ${{ secrets.DOCKERHUB_PASSWORD }} | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

            -   name: Login to GitHub Container Registry
                run: echo ${{ secrets.IMAGES_REPO_TOKEN }} | docker login ghcr.io -u ${{ secrets.IMAGES_REPO_USERNAME }} --password-stdin

            -   name: Install Trivy and oras
                run: |
                    set -euxo pipefail
                    sudo apt-get update
                    sudo apt-get install -y wget curl apt-transport-https gnupg lsb-release jq
                    wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
                    echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
                    sudo apt-get update
                    sudo apt-get install -y trivy

                    ORAS_VERSION="${ORAS_VERSION}" _ci/.github/scripts/install-oras.sh

            -   name: Build plain images
                env:
                    VERSION_OVERRIDE: "${{ matrix.build.version-override }}"
                    ARCH_TAG: ${{ contains(matrix.runner, 'arm') && 'arm64' || 'amd64' }}
                run: |
                    set -eux
                    mkdir -p .docker-state

                    if [[ "${{ matrix.build.tag }}" =~ ^v?1\.[0-9x]+$ ]]; then
                        imageVariants=("fpm" "debug" "supervisord")
                    else
                        imageVariants=("min" "default" "max" "debug" "supervisord")
                    fi
                    printf '%s\n' "${imageVariants[@]}" > .docker-state/variants.txt

                    PHP_SUB_VERSION=$(docker run -i --rm php:${{ matrix.build.php }}-fpm-${{ matrix.build.distro }} php -r 'echo PHP_VERSION;')

                    for imageVariant in "${imageVariants[@]}"; do
                        echo "Building plain image: $imageVariant"
                        mkdir -p ".docker-state/${imageVariant}"

                        VERSION="${{ matrix.build.tag }}"
                        if [ -n "$VERSION_OVERRIDE" ]; then
                            VERSION="$VERSION_OVERRIDE"
                        fi

                        if [ "$imageVariant" = "fpm" ] || [ "$imageVariant" = "default" ]; then
                            BASE_TAG="php${{ matrix.build.php }}"
                            BASE_TAG_DETAILED="php${PHP_SUB_VERSION}"
                        else
                            BASE_TAG="php${{ matrix.build.php }}-${imageVariant}"
                            BASE_TAG_DETAILED="php${PHP_SUB_VERSION}-${imageVariant}"
                        fi

                        TAG="${BASE_TAG}-${VERSION}-${ARCH_TAG}"
                        PLAIN_IMAGE="${IMAGE_NAME}:${TAG}"

                        # Write plain tags one per line; avoids quoting issues in later steps.
                        {
                            echo "${IMAGE_NAME}:${TAG}"
                            echo "${IMAGE_NAME}:${BASE_TAG_DETAILED}-${VERSION}-${ARCH_TAG}"
                            echo "ghcr.io/pimcore/pimcore:${TAG}"
                            echo "ghcr.io/pimcore/pimcore:${BASE_TAG_DETAILED}-${VERSION}-${ARCH_TAG}"
                            if [ "true" = "${{ matrix.build.latest-tag }}" ]; then
                                echo "${IMAGE_NAME}:${BASE_TAG}-latest-${ARCH_TAG}"
                                echo "ghcr.io/pimcore/pimcore:${BASE_TAG}-latest-${ARCH_TAG}"
                            fi
                            if [[ $VERSION =~ ^v[0-9]+\.[0-9]+$ ]]; then
                                VERSION_MAJOR="${VERSION%.*}"
                                echo "${IMAGE_NAME}:${BASE_TAG}-${VERSION_MAJOR}-${ARCH_TAG}"
                                echo "ghcr.io/pimcore/pimcore:${BASE_TAG}-${VERSION_MAJOR}-${ARCH_TAG}"
                            fi
                        } > ".docker-state/${imageVariant}/plain_tags.txt"

                        echo "${PLAIN_IMAGE}" > ".docker-state/${imageVariant}/plain_image.txt"
                        echo "${BASE_TAG}"    > ".docker-state/${imageVariant}/base_tag.txt"
                        echo "${VERSION}"     > ".docker-state/${imageVariant}/version.txt"
                        echo "${TAG}"         > ".docker-state/${imageVariant}/tag.txt"

                        docker build --load \
                            --provenance=false \
                            --platform "linux/${ARCH_TAG}" \
                            --target="pimcore_php_${imageVariant}" \
                            --build-arg PHP_VERSION="${{ matrix.build.php }}" \
                            --build-arg DEBIAN_VERSION="${{ matrix.build.distro }}" \
                            --tag "${PLAIN_IMAGE}" .

                        mkdir -p sboms
                        PLAIN_SBOM="sboms/${TAG}.spdx.json"
                        _ci/.github/scripts/with-retry.sh trivy image --format spdx-json -o "${PLAIN_SBOM}" "${PLAIN_IMAGE}"
                        echo "${PLAIN_SBOM}" > ".docker-state/${imageVariant}/plain_sbom.txt"
                    done

            -   name: Push plain images
                env:
                    PUSH: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
                run: |
                    set -eux

                    mapfile -t imageVariants < .docker-state/variants.txt

                    for imageVariant in "${imageVariants[@]}"; do
                        PLAIN_IMAGE=$(< ".docker-state/${imageVariant}/plain_image.txt")
                        TAG=$(< ".docker-state/${imageVariant}/tag.txt")
                        PLAIN_SBOM=$(< ".docker-state/${imageVariant}/plain_sbom.txt")
                        mapfile -t PLAIN_TAGS < ".docker-state/${imageVariant}/plain_tags.txt"

                        for plain_tag in "${PLAIN_TAGS[@]}"; do
                            if [ "$plain_tag" != "$PLAIN_IMAGE" ]; then
                                docker tag "$PLAIN_IMAGE" "$plain_tag"
                            fi
                        done

                        # Plain ships unconditionally, before the gate ever runs.
                        # Do NOT rmi here: the gate step patches this image into the hardened one.
                        if [[ "$PUSH" == "true" ]]; then
                            printf '%s\n' "${PLAIN_TAGS[@]}" | xargs -P 4 -I {} docker push "{}"

                            PLAIN_DIGEST=$(docker inspect --format '{{index .RepoDigests 0}}' "$PLAIN_IMAGE" 2>/dev/null | sed 's/.*@//')
                            echo "${PLAIN_DIGEST:-unpublished}" > ".docker-state/${imageVariant}/plain_digest.txt"

                            _ci/.github/scripts/attach-sbom.sh "${PLAIN_IMAGE}" "${PLAIN_SBOM}"
                            _ci/.github/scripts/attach-sbom.sh "ghcr.io/pimcore/pimcore:${TAG}" "${PLAIN_SBOM}"

                            # Record the full per-arch tags pushed THIS run, paired with the SBOM
                            # that documents that image; process-tags merges a logical tag only
                            # when both arches were pushed in the same run, and attaches both
                            # per-arch SBOMs to it as OCI referrers.
                            for t in "${PLAIN_TAGS[@]}"; do
                                printf '%s\t%s\n' "$t" "${PLAIN_SBOM}"
                            done >> aggregated_tags.txt
                        fi
                    done

            # Copa is installed AFTER the plain push, and gate failures are contained
            # (scan-patch-gate.sh records the failure and exits 0), so a problem in the
            # scan/patch/gate path never blocks plain publishing (plain-always-publish).
            # Note: the containerd image store is enabled earlier, before the plain build,
            # because it must be active before the image Copa patches locally is built --
            # a failure of that early step aborts the hardened leg before plain ships.
            -   name: Install Copa
                if: ${{ matrix.build.hardened }}
                run: |
                    set -eux
                    COPA_ARCH="$(dpkg --print-architecture)"
                    curl -fsSL -o copa.tar.gz "https://github.com/project-copacetic/copacetic/releases/download/v${COPA_VERSION}/copa_${COPA_VERSION}_linux_${COPA_ARCH}.tar.gz"
                    curl -fsSL -o copacetic_checksums.txt "https://github.com/project-copacetic/copacetic/releases/download/v${COPA_VERSION}/copacetic_checksums.txt"
                    # Verify checksum before extracting. Match the filename exactly ($2 == f):
                    # a substring match also hits copa_..._linux_..._tar.gz.sbom.json (two hashes).
                    EXPECTED_SHA=$(awk -v f="copa_${COPA_VERSION}_linux_${COPA_ARCH}.tar.gz" '$2 == f {print $1}' copacetic_checksums.txt)
                    ACTUAL_SHA=$(sha256sum copa.tar.gz | awk '{print $1}')
                    if [ -z "$EXPECTED_SHA" ]; then
                        echo "::error::No Copa checksum entry for copa_${COPA_VERSION}_linux_${COPA_ARCH}.tar.gz"
                        exit 1
                    fi
                    if [ "$EXPECTED_SHA" != "$ACTUAL_SHA" ]; then
                        echo "::error::Copa checksum mismatch! Expected ${EXPECTED_SHA}, got ${ACTUAL_SHA}"
                        exit 1
                    fi
                    tar -xzf copa.tar.gz copa
                    sudo mv copa /usr/local/bin/copa
                    rm copa.tar.gz copacetic_checksums.txt

            -   name: Scan, patch, and gate hardened images
                if: ${{ matrix.build.hardened }}
                env:
                    ARCH_TAG: ${{ contains(matrix.runner, 'arm') && 'arm64' || 'amd64' }}
                    FAIL_ON_SEVERITY: ${{ inputs.fail_on_severity || 'CRITICAL,HIGH' }}
                    TRIVY_DB_REPOSITORY: ${{ env.TRIVY_DB_REPOSITORY }}
                run: |
                    set -eux
                    mkdir -p trivy-reports

                    # Normalise fail_on_severity into a validated, inclusive Trivy --severity
                    # list (threshold semantics; NONE disables). Logic + unit tests live in
                    # .github/scripts/normalize-severity.sh; an invalid value exits non-zero here.
                    GATE_SEVERITY="$(_ci/.github/scripts/normalize-severity.sh "$FAIL_ON_SEVERITY")"
                    echo "Severity gate: fail_on_severity='${FAIL_ON_SEVERITY}' -> '${GATE_SEVERITY}'"

                    export IMAGE_NAME GATE_SEVERITY ARCH_TAG TRIVY_DB_REPOSITORY

                    mapfile -t imageVariants < .docker-state/variants.txt
                    for imageVariant in "${imageVariants[@]}"; do
                        _ci/.github/scripts/scan-patch-gate.sh "${imageVariant}"
                    done

            # Hardened images are always built + scanned + gated above; publishing them is a
            # separate opt-in. PUSH_HARDENED is true only on a manual dispatch with both
            # publish=true and publish_hardened=true, so scheduled/tag runs (and plain-only
            # test dispatches) build and gate the hardened images but do not push them.
            -   name: Push hardened images
                if: ${{ matrix.build.hardened }}
                env:
                    PUSH_HARDENED: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && inputs.publish_hardened }}
                run: |
                    set -eux

                    mapfile -t imageVariants < .docker-state/variants.txt

                    for imageVariant in "${imageVariants[@]}"; do
                        # Variants whose gate failed have no hardened_image.txt -> skip (plain already shipped).
                        [ -f ".docker-state/${imageVariant}/hardened_image.txt" ] || continue

                        HARDENED_IMAGE=$(< ".docker-state/${imageVariant}/hardened_image.txt")
                        HARDENED_SBOM=$(< ".docker-state/${imageVariant}/hardened_sbom.txt")
                        mapfile -t HARDENED_TAGS < ".docker-state/${imageVariant}/hardened_tags.txt"

                        for hardened_tag in "${HARDENED_TAGS[@]}"; do
                            if [ "$hardened_tag" != "$HARDENED_IMAGE" ]; then
                                docker tag "$HARDENED_IMAGE" "$hardened_tag"
                            fi
                        done

                        if [[ "$PUSH_HARDENED" == "true" ]]; then
                            printf '%s\n' "${HARDENED_TAGS[@]}" | xargs -P 4 -I {} docker push "{}"

                            HARDENED_DIGEST=$(docker inspect --format '{{index .RepoDigests 0}}' "$HARDENED_IMAGE" 2>/dev/null | sed 's/.*@//')
                            echo "${HARDENED_DIGEST:-unpublished}" > ".docker-state/${imageVariant}/hardened_digest.txt"

                            HARDENED_TAG="${HARDENED_IMAGE#"${IMAGE_NAME}":}"
                            _ci/.github/scripts/attach-sbom.sh "${HARDENED_IMAGE}" "${HARDENED_SBOM}"
                            _ci/.github/scripts/attach-sbom.sh "ghcr.io/pimcore/pimcore:${HARDENED_TAG}" "${HARDENED_SBOM}"

                            # Record the full per-arch tags pushed THIS run, paired with the SBOM
                            # that documents that image; process-tags merges a logical tag only
                            # when both arches were pushed in the same run, and attaches both
                            # per-arch SBOMs to it as OCI referrers.
                            for t in "${HARDENED_TAGS[@]}"; do
                                printf '%s\t%s\n' "$t" "${HARDENED_SBOM}"
                            done >> aggregated_tags.txt
                        fi
                    done

            -   name: Collect CVE report data
                if: ${{ matrix.build.hardened }}
                env:
                    ARCH_TAG: ${{ contains(matrix.runner, 'arm') && 'arm64' || 'amd64' }}
                run: |
                    set -euxo pipefail
                    mkdir -p cve-report-data
                    mapfile -t imageVariants < .docker-state/variants.txt
                    # Best-effort, like the severity gate: a scan failure (after retries) omits
                    # that variant from this run's report and warns, but never fails the leg --
                    # the images already published, and the report is transparency, not a gate.
                    for imageVariant in "${imageVariants[@]}"; do
                        TAG=$(< ".docker-state/${imageVariant}/tag.txt")
                        BASE_TAG=$(< ".docker-state/${imageVariant}/base_tag.txt")
                        VERSION=$(< ".docker-state/${imageVariant}/version.txt")
                        PLAIN_IMAGE=$(< ".docker-state/${imageVariant}/plain_image.txt")

                        # Full CVE scan (all severities, OS+library, includes unfixable) of the plain image.
                        _ci/.github/scripts/with-retry.sh trivy image --format json -o "cve-report-data/${TAG}.plain.json" "${PLAIN_IMAGE}" \
                            || { echo "::warning::CVE report: plain scan failed for ${imageVariant}; omitting it from this run's report"; rm -f "cve-report-data/${TAG}.plain.json"; continue; }

                        if [ -f ".docker-state/${imageVariant}/hardened_image.txt" ]; then
                            HARDENED_IMAGE=$(< ".docker-state/${imageVariant}/hardened_image.txt")
                            _ci/.github/scripts/with-retry.sh trivy image --format json -o "cve-report-data/${TAG}.hardened.json" "${HARDENED_IMAGE}" \
                                || { echo "::warning::CVE report: hardened scan failed for ${imageVariant}; omitting it from this run's report"; rm -f "cve-report-data/${TAG}.plain.json" "cve-report-data/${TAG}.hardened.json"; continue; }
                        fi

                        PLAIN_DIGEST=$(cat ".docker-state/${imageVariant}/plain_digest.txt" 2>/dev/null || echo "unpublished")
                        HARDENED_DIGEST=$(cat ".docker-state/${imageVariant}/hardened_digest.txt" 2>/dev/null || echo "unpublished")
                        jq -n \
                            --arg image "${BASE_TAG}-${VERSION}" \
                            --arg variant "${imageVariant}" \
                            --arg arch "${ARCH_TAG}" \
                            --arg pd "${PLAIN_DIGEST}" \
                            --arg hd "${HARDENED_DIGEST}" \
                            '{image:$image, variant:$variant, arch:$arch, plain_digest:$pd, hardened_digest:$hd}' \
                            > "cve-report-data/${TAG}.meta.json"
                    done

            -   name: Clean up images
                if: ${{ always() }}
                run: |
                    set -u
                    [ -f .docker-state/variants.txt ] || exit 0
                    mapfile -t imageVariants < .docker-state/variants.txt
                    for imageVariant in "${imageVariants[@]}"; do
                        for tf in plain_tags hardened_tags; do
                            f=".docker-state/${imageVariant}/${tf}.txt"
                            [ -f "$f" ] || continue
                            while IFS= read -r t; do docker rmi "$t" 2>/dev/null || true; done < "$f"
                        done
                        for imf in plain_image hardened_image; do
                            f=".docker-state/${imageVariant}/${imf}.txt"
                            [ -f "$f" ] || continue
                            docker rmi "$(< "$f")" 2>/dev/null || true
                        done
                    done

            -   name: Upload trivy reports
                if: always()
                uses: actions/upload-artifact@v7
                with:
                    name: trivy-reports_${{ matrix.runner }}_${{ matrix.build.tag }}_${{ matrix.build.php }}_${{ matrix.build.distro }}_${{ matrix.build.version-override }}_${{ matrix.build.latest-tag }}
                    path: trivy-reports/
                    if-no-files-found: ignore

            -   name: Upload SBOMs
                if: always()
                uses: actions/upload-artifact@v7
                with:
                    name: sboms_${{ matrix.runner }}_${{ matrix.build.tag }}_${{ matrix.build.php }}_${{ matrix.build.distro }}_${{ matrix.build.version-override }}_${{ matrix.build.latest-tag }}
                    path: sboms/
                    if-no-files-found: ignore

            -   name: Upload CVE report data
                if: always()
                uses: actions/upload-artifact@v7
                with:
                    name: cve-report-data_${{ matrix.runner }}_${{ matrix.build.tag }}_${{ matrix.build.php }}_${{ matrix.build.distro }}_${{ matrix.build.version-override }}_${{ matrix.build.latest-tag }}
                    path: cve-report-data/
                    if-no-files-found: ignore

            -   name: Upload aggregated tags
                if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.publish) }}
                uses: actions/upload-artifact@v7
                with:
                    name: aggregated_tags_${{ matrix.runner }}_${{ matrix.build.tag }}_${{ matrix.build.php }}_${{ matrix.build.distro }}_${{ matrix.build.version-override }}_${{ matrix.build.latest-tag }}
                    path: aggregated_tags.txt
                    if-no-files-found: ignore

            -   name: Report severity gate results
                if: ${{ matrix.build.hardened }}
                run: |
                    # Hardened publishing is best-effort: a gate / Copa-patch failure skips the
                    # -hardened tag for that variant but must NOT fail the job -- the plain image
                    # already shipped, and some stable lines (e.g. EOL Debian releases whose fixed
                    # packages are no longer served) can never be fully patched. The failure is
                    # surfaced as a warning and in the step summary (scan-patch-gate.sh records the
                    # reason there), not as a red pipeline.
                    if compgen -G '.docker-state/*/gate_failed.txt' > /dev/null; then
                        echo "The following variants failed the severity gate; their -hardened tags were NOT published (plain images shipped as usual):"
                        grep -H . .docker-state/*/gate_failed.txt
                        echo "::warning::One or more variants failed the severity gate; their -hardened tags were skipped (plain image handling is unaffected)."
                    else
                        echo "All hardened variants passed the severity gate."
                    fi

    process-tags:
        runs-on: ubuntu-22.04
        needs: build-php
        if: ${{ always() && github.repository == 'pimcore/docker' && (github.event_name != 'workflow_dispatch' || inputs.publish) }}
        # Explicit and minimal. Nothing in this job authenticates with GITHUB_TOKEN except
        # checkout (contents:read) and the two downloads below (actions:read) -- both
        # registry logins use repository secrets, and merge-manifests.sh/attach-sbom.sh
        # talk to Docker Hub and ghcr.io through the docker/oras credential store, not
        # through GITHUB_TOKEN. So no packages: or contents: write is needed here.
        permissions:
            contents: read
            # download-artifact needs actions:read to use the public REST API path.
            actions: read
        steps:

            -   name: Check out CI scripts from the workflow ref
                uses: actions/checkout@v5
                with:
                    path: _ci
                    sparse-checkout: .github/scripts
                    sparse-checkout-cone-mode: false

            -   name: Set up Docker Buildx
                uses: docker/setup-buildx-action@v4

            -   name: Install oras
                run: ORAS_VERSION="${ORAS_VERSION}" _ci/.github/scripts/install-oras.sh

            -   name: Login to DockerHub Registry
                run: echo ${{ secrets.DOCKERHUB_PASSWORD }} | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

            -   name: Login to GitHub Container Registry
                run: echo ${{ secrets.IMAGES_REPO_TOKEN }} | docker login ghcr.io -u ${{ secrets.IMAGES_REPO_USERNAME }} --password-stdin

            -   name: Download aggregated tags
                uses: actions/download-artifact@v8
                with:
                    path: artifacts
                    pattern: aggregated_tags_*
                    # Same actions/download-artifact#486 fix as publish-cve-report below:
                    # without a token the internal artifact API 404s artifacts written by a
                    # PREVIOUS attempt, so "Re-run failed jobs" can never see them. This
                    # step is not continue-on-error, so today it fails loudly rather than
                    # going green empty -- but it still cannot be re-run without the token.
                    github-token: ${{ github.token }}

            -   name: Download SBOMs
                uses: actions/download-artifact@v8
                with:
                    path: sboms
                    pattern: sboms_*
                    merge-multiple: true
                    github-token: ${{ github.token }}

            -   name: Process tags
                run: |
                    set -uo pipefail
                    find artifacts -type f -name "aggregated_tags.txt" -exec cat {} + > all_aggregated_tags.txt
                    _ci/.github/scripts/merge-manifests.sh

    publish-cve-report:
        runs-on: ubuntu-22.04
        needs: build-php
        if: ${{ always() && github.repository == 'pimcore/docker' && (github.event_name != 'workflow_dispatch' || inputs.publish) }}
        permissions:
            contents: write
            # download-artifact needs actions:read to use the public REST API path.
            actions: read
        steps:
            -   uses: actions/checkout@v5
            -   name: Download CVE report data
                # Best-effort: if no cve-report-data_* artifacts exist this run (or the
                # download hiccups), don't fail the job -- the next step's no-data check
                # then exits 0 and leaves the committed report unchanged.
                continue-on-error: true
                uses: actions/download-artifact@v8
                with:
                    path: cve-artifacts
                    pattern: cve-report-data_*
                    # Without a token the action uses the internal artifact API, whose
                    # GetSignedArtifactURL rejects artifacts from a PREVIOUS attempt with
                    # "(404) workflow run not found" (actions/download-artifact#486). On a
                    # "Re-run failed jobs" that 404s every download; combined with
                    # continue-on-error above, the job then goes green having produced no
                    # report at all -- exactly what happened in run 30265129837. The token
                    # switches it to the public REST API, which handles cross-attempt reads.
                    github-token: ${{ github.token }}
            -   name: Generate and commit the known-CVE report
                run: |
                    set -euo pipefail
                    # cve-artifacts may not exist if the download matched zero artifacts;
                    # create it so the find below can't fail before the no-data skip fires.
                    mkdir -p _cvedata docs cve-artifacts
                    # Flatten all per-leg artifact dirs into one (filenames are unique per image+arch).
                    find cve-artifacts -type f \( -name '*.meta.json' -o -name '*.plain.json' -o -name '*.hardened.json' \) \
                        -exec cp -n {} _cvedata/ \;
                    if [ -z "$(find _cvedata -name '*.meta.json' -print -quit)" ]; then
                        echo "No CVE report data this run; leaving the committed report unchanged."
                        exit 0
                    fi

                    TS="$(date -u '+%Y-%m-%d %H:%M UTC')"
                    .github/scripts/cve-aggregate.sh _cvedata "$TS" > cve-data.json

                    # Severity split. One flat table of every severity is ~608 KB, over the
                    # 512 KB GitHub render limit; these three slices are ~226/232/376 KB.
                    {
                        .github/scripts/cve-render-summary.sh cve-data.json
                        .github/scripts/cve-render-table.sh cve-data.json CRITICAL,HIGH "Critical & high severity"
                        printf '\n\nFull detail for the remaining severities: '
                        printf '[MEDIUM](known-cves-medium.md) · [LOW and UNKNOWN](known-cves-low.md).\n'
                    } > docs/known-cves.md

                    {
                        printf '# Known CVEs — MEDIUM\n\n_Generated %s._ Back to the [summary](known-cves.md).\n\n' "$TS"
                        .github/scripts/cve-render-table.sh cve-data.json MEDIUM
                    } > docs/known-cves-medium.md

                    {
                        printf '# Known CVEs — LOW and UNKNOWN\n\n_Generated %s._ Back to the [summary](known-cves.md).\n\n' "$TS"
                        .github/scripts/cve-render-table.sh cve-data.json LOW,UNKNOWN
                    } > docs/known-cves-low.md

                    for f in docs/known-cves.md docs/known-cves-medium.md docs/known-cves-low.md; do
                        .github/scripts/cve-size-guard.sh "$f"
                    done

                    # Per-run visibility on the run page itself, whether or not the commit happens.
                    .github/scripts/cve-render-summary.sh cve-data.json >> "$GITHUB_STEP_SUMMARY"

                    if [ "${GITHUB_REF_TYPE:-}" != "branch" ]; then
                        echo "Not a branch run (ref_type=${GITHUB_REF_TYPE:-unknown}); skipping the report commit."
                        exit 0
                    fi

                    git config user.name  "github-actions[bot]"
                    git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                    git add docs/known-cves.md docs/known-cves-medium.md docs/known-cves-low.md
                    if git diff --cached --quiet; then
                        echo "Known-CVE report unchanged."
                        exit 0
                    fi
                    git commit -m "docs: update known-CVEs report [skip ci]"
                    git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
                    git push origin "HEAD:${GITHUB_REF_NAME}"

            -   name: Upload machine-readable CVE data
                # The canonical JSON is ~2.8 MB and includes the kernel-header rows the
                # committed tables omit. Uploaded, never committed: at ~2.8 MB per release
                # it would grow the repository without bound.
                if: ${{ always() && hashFiles('cve-data.json') != '' }}
                uses: actions/upload-artifact@v7
                with:
                    name: cve-report-json
                    path: cve-data.json
