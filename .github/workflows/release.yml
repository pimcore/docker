name: Docker Build & Release

on:
    workflow_dispatch:
        inputs:
            publish:
                description: 'Publish images to registries'
                required: false
                default: false
                type: boolean
            fail_on_severity:
                description: 'Comma-separated list of severities that fail the build if post-patch CVEs remain (e.g. CRITICAL,HIGH). Valid values: CRITICAL, HIGH, MEDIUM, LOW. Use NONE to disable the gate entirely.'
                required: false
                default: 'CRITICAL,HIGH'
                type: string
    push:
        tags:
            - 'v*.*'
    schedule:
        -   cron: '30 2 * * 1,3,5'

env:
    IMAGE_NAME: pimcore/pimcore
    COPA_VERSION: "0.14.1"
    BUILDKIT_VERSION: "0.30.0"
    TRIVY_DB_REPOSITORY: "ghcr.io/aquasecurity/trivy-db:2"

jobs:
    build-php:
        name: "Build PHP images"
        runs-on: ${{ matrix.runner }}
        if: github.repository == 'pimcore/docker'
        strategy:
            matrix:
                runner:
                    - ubuntu-22.04
                    - ubuntu-22.04-arm
                build:
                    - { tag: '1.x', php: '8.1', distro: bullseye, version-override: "v1-dev", latest-tag: false, imagePatch: false }
                    - { tag: '1.x', php: '8.2', distro: bullseye, version-override: "v1-dev", latest-tag: false, imagePatch: false }
                    - { tag: 'v1.6', php: '8.1', distro: bullseye, version-override: "", latest-tag: true, imagePatch: true }
                    - { tag: 'v1.6', php: '8.2', distro: bullseye, version-override: "", latest-tag: false, imagePatch: true }
                    - { tag: 'v2.3', php: '8.2', distro: bullseye, version-override: "", latest-tag: false, imagePatch: true }
                    - { tag: '2.x', php: '8.2', distro: bullseye, version-override: "v2-dev", latest-tag: false, imagePatch: false }
                    - { tag: 'v3.8', php: '8.2', distro: bookworm, version-override: "", latest-tag: true, imagePatch: true }
                    - { tag: 'v3.8', php: '8.3', distro: bookworm, version-override: "", latest-tag: true, imagePatch: true }
                    - { tag: '3.x', php: '8.2', distro: bookworm, version-override: "v3-dev", latest-tag: false, imagePatch: false }
                    - { tag: '3.x', php: '8.3', distro: bookworm, version-override: "v3-dev", latest-tag: false, imagePatch: false }
                    - { tag: 'v4.1', php: '8.4', distro: bookworm, version-override: "", latest-tag: true, imagePatch: true }
                    - { tag: '4.x', php: '8.4', distro: bookworm, version-override: "v4-dev", latest-tag: false, imagePatch: false }
                    - { tag: '5.x', php: '8.5', distro: trixie, version-override: "", latest-tag: false, imagePatch: false }
                    - { tag: 'v5.1', php: '8.5', distro: trixie, version-override: "", latest-tag: true, imagePatch: true }
                    - { tag: '5.x', php: '8.5', distro: trixie, version-override: "v5-dev", latest-tag: false, imagePatch: false }

        steps:
            -   uses: actions/checkout@v5
                with:
                    ref: ${{ matrix.build.tag }}

            -   name: Login to DockerHub Registry
                run: echo ${{ secrets.DOCKERHUB_PASSWORD }} | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

            -   name: Login to GitHub Container Registry
                run: echo ${{ secrets.IMAGES_REPO_TOKEN }} | docker login ghcr.io -u ${{ secrets.IMAGES_REPO_USERNAME }} --password-stdin

            -   name: Install Copa and Trivy
                run: |
                    set -eux
                    # Install Trivy
                    sudo apt-get update
                    sudo apt-get install -y wget curl apt-transport-https gnupg lsb-release jq
                    wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
                    echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
                    sudo apt-get update
                    sudo apt-get install -y trivy

                    # Install Copa
                    COPA_ARCH="$(dpkg --print-architecture)"
                    curl -fsSL -o copa.tar.gz "https://github.com/project-copacetic/copacetic/releases/download/v${COPA_VERSION}/copa_${COPA_VERSION}_linux_${COPA_ARCH}.tar.gz"
                    curl -fsSL -o copacetic_checksums.txt "https://github.com/project-copacetic/copacetic/releases/download/v${COPA_VERSION}/copacetic_checksums.txt"
                    # Verify checksum before extracting
                    EXPECTED_SHA=$(grep "copa_${COPA_VERSION}_linux_${COPA_ARCH}.tar.gz" copacetic_checksums.txt | awk '{print $1}')
                    ACTUAL_SHA=$(sha256sum copa.tar.gz | awk '{print $1}')
                    if [ "$EXPECTED_SHA" != "$ACTUAL_SHA" ]; then
                        echo "::error::Copa checksum mismatch! Expected ${EXPECTED_SHA}, got ${ACTUAL_SHA}"
                        exit 1
                    fi
                    tar -xzf copa.tar.gz copa
                    sudo mv copa /usr/local/bin/copa
                    rm copa.tar.gz copacetic_checksums.txt

            -   name: Start buildkit daemon
                run: |
                    docker run --detach --rm --privileged \
                        -p 127.0.0.1:8888:8888/tcp \
                        --name buildkitd \
                        --entrypoint buildkitd \
                            moby/buildkit:v${{ env.BUILDKIT_VERSION }} \
                        --addr tcp://0.0.0.0:8888

                    # Wait for buildkit to be ready
                    for i in $(seq 1 60); do
                        if docker exec buildkitd buildctl --addr tcp://127.0.0.1:8888 debug workers >/dev/null 2>&1; then
                            echo "BuildKit is ready"
                            break
                        fi
                        if [ "$i" -eq 60 ]; then
                            echo "::error::BuildKit failed to start within 60 seconds"
                            exit 1
                        fi
                        sleep 1
                    done

            -   name: Configure and build images
                id: vars
                env:
                    VERSION_OVERRIDE: "${{ matrix.build.version-override }}"
                    ARCH_TAG: ${{ contains(matrix.runner, 'arm') && 'arm64' || 'amd64' }}
                    PUSH: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
                    FAIL_ON_SEVERITY: ${{ inputs.fail_on_severity || 'CRITICAL,HIGH' }}
                    TRIVY_DB_REPOSITORY: ${{ env.TRIVY_DB_REPOSITORY }}
                run: |
                    set -eux;

                    mkdir -p trivy-reports
                    echo ${{ matrix.runner}}

                    if [[ "${{ matrix.build.tag }}" =~ ^v?1.[0-9x]+$ ]]; then
                        imageVariants=("fpm" "debug" "supervisord")
                    else
                        imageVariants=("min" "default" "max" "debug" "supervisord")
                    fi
                    for imageVariant in ${imageVariants[@]}; do
                        echo "Building image variant $imageVariant"
                        DOCKER_PLATFORMS=linux/amd64,linux/arm64
                        PHP_VERSION=${{ matrix.build.php }}
                        DEBIAN_VERSION="${{ matrix.build.distro }}"
                        VERSION="${{ matrix.build.tag }}"
                        # for the latest dev branch we use "dev" as the version and not the name of the branch
                        if [ ! -z "$VERSION_OVERRIDE" ]; then
                            VERSION="$VERSION_OVERRIDE"
                        fi
                        PHP_SUB_VERSION=$(docker run -i --rm php:${{ matrix.build.php }}-fpm-${{ matrix.build.distro }} php -r 'echo PHP_VERSION;')
                        if [ "$imageVariant" = "fpm"  ] || [ "$imageVariant" = "default"  ]; then
                            BASE_TAG="php${{ matrix.build.php }}"
                            BASE_TAG_DETAILED="php${PHP_SUB_VERSION}"
                        else
                            BASE_TAG="php${{ matrix.build.php }}-$imageVariant"
                            BASE_TAG_DETAILED="php${PHP_SUB_VERSION}-$imageVariant"
                        fi
                        # DEBUG / TEST
                        #BASE_TAG="testv3-$BASE_TAG"
                        #BASE_TAG_DETAILED="testv3-$BASE_TAG_DETAILED"


                        TAG="${BASE_TAG}-${VERSION}-${ARCH_TAG}"
                        TAG_DETAILED="${BASE_TAG_DETAILED}-${VERSION}-${ARCH_TAG}"

                        GHCR_TAG="ghcr.io/pimcore/pimcore:${TAG}"
                        GHCR_TAG_DETAILED="ghcr.io/pimcore/pimcore:${TAG_DETAILED}"

                        TAGS="--tag ${IMAGE_NAME}:${TAG}"
                        TAGS="$TAGS --tag ${IMAGE_NAME}:${TAG_DETAILED}"

                        TAGS="$TAGS --tag $GHCR_TAG"
                        TAGS="$TAGS --tag $GHCR_TAG_DETAILED"

                        # Tag latest with Version build too
                        if [ "true" = "${{ matrix.build.latest-tag }}" ]; then
                            TAGS="$TAGS --tag ${IMAGE_NAME}:${BASE_TAG}-latest-${ARCH_TAG}"
                            TAGS="$TAGS --tag ghcr.io/pimcore/pimcore:${BASE_TAG}-latest-${ARCH_TAG}"
                        fi
                        # Create tag for major version
                        if [[ $VERSION =~ ^v[0-9]+.[0-9]+$ ]]; then
                            VERSION_MAJOR="${VERSION//.[0-9]/}"
                            TAG_MAJOR="${BASE_TAG}-${VERSION_MAJOR}-${ARCH_TAG}"
                            GHCR_TAG_MAJOR="ghcr.io/pimcore/pimcore:${TAG_MAJOR}"
                            TAGS="$TAGS --tag ${IMAGE_NAME}:${TAG_MAJOR}"
                            TAGS="$TAGS --tag $GHCR_TAG_MAJOR"
                        fi

                        # Build and load the plain image locally. The plain image is
                        # published as-is under the unsuffixed tags; it is never patched.
                        PLAIN_IMAGE="${IMAGE_NAME}:${TAG}"
                        docker build --load \
                            --provenance=false \
                            --platform "linux/${ARCH_TAG}" \
                            --target="pimcore_php_$imageVariant" \
                            --build-arg PHP_VERSION="${PHP_VERSION}" \
                            --build-arg DEBIAN_VERSION="${DEBIAN_VERSION}" \
                            --tag "${PLAIN_IMAGE}" .

                        # Plain tag set (every entry carries the -${ARCH_TAG} suffix).
                        CLEAN_PLAIN_TAGS="${TAGS//--tag /}"
                        read -r -a PLAIN_TAGS <<< "$CLEAN_PLAIN_TAGS"

                        # ALL_TAGS accumulates everything we push, aggregate and clean up.
                        ALL_TAGS=("${PLAIN_TAGS[@]}")

                        # Produce the hardened (Copa-patched) image and its -hardened tag set.
                        if [ "${{ matrix.build.imagePatch }}" = "true" ]; then
                            HARDENED_IMAGE="${IMAGE_NAME}:${BASE_TAG}-${VERSION}-hardened-${ARCH_TAG}"

                            echo "Scanning plain image ${PLAIN_IMAGE} for OS vulnerabilities"
                            trivy image --pkg-types os --ignore-unfixed --format json \
                                -o /tmp/trivy-report.json "${PLAIN_IMAGE}"

                            if [ -s /tmp/trivy-report.json ] && jq -e '.Results[]? | select(.Vulnerabilities != null and (.Vulnerabilities | length > 0))' /tmp/trivy-report.json > /dev/null 2>&1; then
                                # Patch from the plain image into a new -hardened tag; the plain image is left intact.
                                copa patch -i "${PLAIN_IMAGE}" \
                                    -r /tmp/trivy-report.json \
                                    -t "${BASE_TAG}-${VERSION}-hardened-${ARCH_TAG}" \
                                    -a tcp://127.0.0.1:8888

                                if ! docker image inspect "${HARDENED_IMAGE}" > /dev/null 2>&1; then
                                    echo "::error::Hardened image not found for ${PLAIN_IMAGE}"
                                    exit 1
                                fi
                                echo "Successfully patched ${PLAIN_IMAGE} into ${HARDENED_IMAGE}"
                            else
                                # Nothing fixable: the hardened tag mirrors the plain image so it always exists.
                                echo "No fixable OS vulnerabilities found; hardened image mirrors plain"
                                docker tag "${PLAIN_IMAGE}" "${HARDENED_IMAGE}"
                            fi
                            rm -f /tmp/trivy-report.json

                            # Derive the hardened tag set by inserting -hardened before the arch suffix.
                            HARDENED_TAGS=()
                            for plain_tag in "${PLAIN_TAGS[@]}"; do
                                HARDENED_TAGS+=("${plain_tag%-${ARCH_TAG}}-hardened-${ARCH_TAG}")
                            done

                            # Post-patch vulnerability gate, run on the hardened image only.
                            # The plain image is intentionally ungated. A failure here aborts the
                            # step before any push, so nothing ships for this variant.
                            FAIL_SEVERITY="$FAIL_ON_SEVERITY"
                            if [ "$FAIL_SEVERITY" != "NONE" ]; then
                                echo "Running post-patch scan (fail on ${FAIL_SEVERITY}+)"

                                # Get the image hash for report naming
                                IMAGE_HASH=$(docker image inspect "${HARDENED_IMAGE}" --format '{{.Id}}' | sed 's/sha256://' | head -c 12)

                                trivy image --pkg-types os --ignore-unfixed \
                                    --severity "$FAIL_SEVERITY" \
                                    --format table \
                                    -o /tmp/trivy-os-${TAG}.txt \
                                    "${HARDENED_IMAGE}" || true

                                # Save report with image hash for artifact upload
                                trivy image --pkg-types os --ignore-unfixed \
                                    --severity "$FAIL_SEVERITY" \
                                    --format json \
                                    -o "trivy-reports/${TAG}-hardened_${IMAGE_HASH}.json" \
                                    "${HARDENED_IMAGE}" || true
                                cp /tmp/trivy-os-${TAG}.txt "trivy-reports/${TAG}-hardened_${IMAGE_HASH}.txt" 2>/dev/null || true

                                trivy image --pkg-types os --ignore-unfixed \
                                    --exit-code 1 \
                                    --severity "$FAIL_SEVERITY" \
                                    "${HARDENED_IMAGE}"

                                # Attach scan results to GitHub Actions job summary
                                {
                                    echo "## Trivy Scan: ${HARDENED_IMAGE}"
                                    echo ""
                                    echo "### OS Vulnerabilities (${FAIL_SEVERITY}+)"
                                    echo '```'
                                    cat /tmp/trivy-os-${TAG}.txt 2>/dev/null || echo "No results"
                                    echo '```'
                                    echo ""
                                } >> "$GITHUB_STEP_SUMMARY"
                                rm -f /tmp/trivy-os-${TAG}.txt
                            fi

                            ALL_TAGS+=("${HARDENED_TAGS[@]}")
                        else
                            echo "Copa patching skipped (imagePatch: false)"
                        fi

                        # Apply every tag to its source image (plain or hardened).
                        for additional_tag in "${ALL_TAGS[@]}"; do
                            case "$additional_tag" in
                                *-hardened-${ARCH_TAG}) src_image="${HARDENED_IMAGE}" ;;
                                *) src_image="${PLAIN_IMAGE}" ;;
                            esac
                            if [ "$additional_tag" != "$src_image" ]; then
                                docker tag "$src_image" "$additional_tag"
                            fi
                        done

                        # Push if publishing (parallel for speed)
                        if [[ "$PUSH" == "true" ]]; then
                            printf '%s\n' "${ALL_TAGS[@]}" | xargs -P 4 -I {} docker push "{}"
                        fi

                        docker inspect "${PLAIN_IMAGE}" || true;

                        # Only aggregate tags if we're publishing. Strip the arch suffix so the
                        # process-tags job can merge per-arch tags into a multi-arch manifest.
                        if [[ "$PUSH" == "true" ]]; then
                            for tag in "${ALL_TAGS[@]}"; do
                                logical_tag="${tag//-arm64/}"
                                logical_tag="${logical_tag//-amd64/}"
                                echo "Processing tag: $logical_tag"
                                echo "$logical_tag" >> aggregated_tags.txt
                            done
                        fi

                        # Clean up to save disk space
                        docker rmi "${PLAIN_IMAGE}" || true
                        if [ "${{ matrix.build.imagePatch }}" = "true" ]; then
                            docker rmi "${HARDENED_IMAGE}" || true
                        fi
                        for additional_tag in "${ALL_TAGS[@]}"; do
                            docker rmi "$additional_tag" 2>/dev/null || true
                        done

                    done

            -   name: Stop buildkit daemon
                if: always()
                run: docker stop buildkitd || true

            -   name: Upload trivy reports
                if: always()
                uses: actions/upload-artifact@v7
                with:
                    name: trivy-reports_${{ matrix.runner }}_${{ matrix.build.tag }}_${{ matrix.build.php }}_${{ matrix.build.distro }}_${{ matrix.build.version-override }}_${{ matrix.build.latest-tag }}
                    path: trivy-reports/
                    if-no-files-found: ignore

            -   name: Upload aggregated tags
                if: github.event_name != 'workflow_dispatch' || inputs.publish
                uses: actions/upload-artifact@v7
                with:
                    name: aggregated_tags_${{ matrix.runner }}_${{ matrix.build.tag }}_${{ matrix.build.php }}_${{ matrix.build.distro }}_${{ matrix.build.version-override }}_${{ matrix.build.latest-tag }}
                    path: aggregated_tags.txt
        
    process-tags:
        runs-on: ubuntu-22.04
        needs: build-php
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        steps:
            
            -   name: Login to DockerHub Registry
                run: echo ${{ secrets.DOCKERHUB_PASSWORD }} | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

            -   name: Login to GitHub Container Registry
                run: echo ${{ secrets.IMAGES_REPO_TOKEN }} | docker login ghcr.io -u ${{ secrets.IMAGES_REPO_USERNAME }} --password-stdin

            -   name: Download aggregated tags
                uses: actions/download-artifact@v8
                with:
                    path: artifacts
                
            -   name: Process tags
                run: |
                    find artifacts -type f -name "aggregated_tags.txt" -exec cat {} + > all_aggregated_tags.txt

                    readarray -t TAGS_ARRAY < all_aggregated_tags.txt

                    declare -A UNIQUE_TAGS
                    for tag in "${TAGS_ARRAY[@]}"; do
                        UNIQUE_TAGS["$tag"]=1
                    done

                    for tag in "${!UNIQUE_TAGS[@]}"; do
                    
                        echo "Processing tag: $tag"
                        
                        docker manifest create "$tag" \
                        --amend "${tag}-amd64" \
                        --amend "${tag}-arm64"

                        docker manifest push "$tag"
    
                    done

