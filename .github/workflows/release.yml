name: Docker Build & Release

on:
    workflow_dispatch:
        inputs:
            publish:
                description: 'Publish images to registries'
                required: false
                default: false
                type: boolean
            fail_on_severity:
                description: 'Fail build if post-patch CVEs remain at this severity (CRITICAL, HIGH, MEDIUM, LOW, or NONE to disable)'
                required: false
                default: 'CRITICAL,HIGH'
                type: string
    push:
        tags:
            - 'v*.*'
    schedule:
        -   cron: '30 2 * * 1,3,5'

env:
    IMAGE_NAME: pimcore/pimcore

jobs:
    build-php:
        name: "Build PHP images"
        runs-on: ${{ matrix.runner }}
        if: github.repository == 'pimcore/docker'
        strategy:
            matrix:
                runner:
                    - ubuntu-22.04
                    - ubuntu-22.04-arm
                build:
                    - { tag: '1.x', php: '8.1', distro: bullseye, version-override: "v1-dev", latest-tag: false }
                    - { tag: '1.x', php: '8.2', distro: bullseye, version-override: "v1-dev", latest-tag: false }
                    - { tag: 'v1.6', php: '8.1', distro: bullseye, version-override: "", latest-tag: true }
                    - { tag: 'v1.6', php: '8.2', distro: bullseye, version-override: "", latest-tag: false }
                    - { tag: 'v2.3', php: '8.2', distro: bullseye, version-override: "", latest-tag: false }
                    - { tag: '2.x', php: '8.2', distro: bullseye, version-override: "v2-dev", latest-tag: false }
                    - { tag: 'v3.8', php: '8.2', distro: bookworm, version-override: "", latest-tag: true }
                    - { tag: 'v3.8', php: '8.3', distro: bookworm, version-override: "", latest-tag: true }
                    - { tag: '3.x', php: '8.2', distro: bookworm, version-override: "v3-dev", latest-tag: false }
                    - { tag: '3.x', php: '8.3', distro: bookworm, version-override: "v3-dev", latest-tag: false }
                    - { tag: 'v4.1', php: '8.4', distro: bookworm, version-override: "", latest-tag: true }
                    - { tag: '4.x', php: '8.4', distro: bookworm, version-override: "v4-dev", latest-tag: false }
                    - { tag: '5.x', php: '8.5', distro: trixie, version-override: "", latest-tag: false }
                    - { tag: 'v5.1', php: '8.5', distro: trixie, version-override: "", latest-tag: true } 
                    - { tag: '5.x', php: '8.5', distro: trixie, version-override: "v5-dev", latest-tag: false } 

        steps:
            -   uses: actions/checkout@v5
                with:
                    ref: ${{ matrix.build.tag }}

            -   name: Login to DockerHub Registry
                run: echo ${{ secrets.DOCKERHUB_PASSWORD }} | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

            -   name: Login to GitHub Container Registry
                run: echo ${{ secrets.IMAGES_REPO_TOKEN }} | docker login ghcr.io -u ${{ secrets.IMAGES_REPO_USERNAME }} --password-stdin

            -   name: Install Copa and Trivy
                run: |
                    set -eux
                    # Install Trivy
                    sudo apt-get update
                    sudo apt-get install -y wget apt-transport-https gnupg lsb-release
                    wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
                    echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
                    sudo apt-get update
                    sudo apt-get install -y trivy

                    # Install Copa
                    COPA_VERSION="0.14.1"
                    curl -fsSL -o copa.tar.gz "https://github.com/project-copacetic/copacetic/releases/download/v${COPA_VERSION}/copa_${COPA_VERSION}_linux_$(dpkg --print-architecture).tar.gz"
                    tar -xzf copa.tar.gz copa
                    sudo mv copa /usr/local/bin/copa
                    rm copa.tar.gz

            -   name: Start buildkit daemon
                run: |
                    docker run --detach --rm --privileged \
                        -p 127.0.0.1:8888:8888/tcp \
                        --name buildkitd \
                        --entrypoint buildkitd \
                            moby/buildkit:v0.30.0 \
                        --addr tcp://0.0.0.0:8888

                    # Wait for buildkit to be ready
                    for i in $(seq 1 60); do
                            if docker exec buildkitd buildctl --addr tcp://127.0.0.1:8888 debug workers >/dev/null 2>&1; then
                            echo "BuildKit is ready"
                            break
                        fi
                        if [ "$i" -eq 60 ]; then
                            echo "::error::BuildKit failed to start within 60 seconds"
                            exit 1
                        fi
                        sleep 1
                    done

            -   name: Configure and build images
                id: vars
                env:
                    VERSION_OVERRIDE: "${{ matrix.build.version-override }}"
                    ARCH_TAG: ${{ contains(matrix.runner, 'arm') && 'arm64' || 'amd64' }}
                    PUSH: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
                    FAIL_ON_SEVERITY: ${{ inputs.fail_on_severity || 'CRITICAL' }}
                run: |
                    set -eux;

                    echo ${{ matrix.runner}}

                    if [[ "${{ matrix.build.tag }}" =~ ^v?1.[0-9x]+$ ]]; then
                        imageVariants=("fpm" "debug" "supervisord")
                    else
                        imageVariants=("min" "default" "max" "debug" "supervisord")
                    fi
                    for imageVariant in ${imageVariants[@]}; do
                        echo "Building image variant $imageVariant"
                        DOCKER_PLATFORMS=linux/amd64,linux/arm64
                        PHP_VERSION=${{ matrix.build.php }}
                        DEBIAN_VERSION="${{ matrix.build.distro }}"
                        VERSION="${{ matrix.build.tag }}"
                        # for the latest dev branch we use "dev" as the version and not the name of the branch
                        if [ ! -z "$VERSION_OVERRIDE" ]; then
                            VERSION="$VERSION_OVERRIDE"
                        fi
                        PHP_SUB_VERSION=$(docker run -i --rm php:${{ matrix.build.php }}-fpm-${{ matrix.build.distro }} php -r 'echo PHP_VERSION;')
                        if [ "$imageVariant" = "fpm"  ] || [ "$imageVariant" = "default"  ]; then
                            BASE_TAG="php${{ matrix.build.php }}"
                            BASE_TAG_DETAILED="php${PHP_SUB_VERSION}"
                        else
                            BASE_TAG="php${{ matrix.build.php }}-$imageVariant"
                            BASE_TAG_DETAILED="php${PHP_SUB_VERSION}-$imageVariant"
                        fi
                        # DEBUG / TEST
                        #BASE_TAG="testv3-$BASE_TAG"
                        #BASE_TAG_DETAILED="testv3-$BASE_TAG_DETAILED"


                        TAG="${BASE_TAG}-${VERSION}-${ARCH_TAG}"
                        TAG_DETAILED="${BASE_TAG_DETAILED}-${VERSION}-${ARCH_TAG}"

                        GHCR_TAG="ghcr.io/pimcore/pimcore:${TAG}"
                        GHCR_TAG_DETAILED="ghcr.io/pimcore/pimcore:${TAG_DETAILED}"

                        TAGS="--tag ${IMAGE_NAME}:${TAG}"
                        TAGS="$TAGS --tag ${IMAGE_NAME}:${TAG_DETAILED}"

                        TAGS="$TAGS --tag $GHCR_TAG"
                        TAGS="$TAGS --tag $GHCR_TAG_DETAILED"

                        # Tag latest with Version build too
                        if [ "true" = "${{ matrix.build.latest-tag }}" ]; then
                            TAGS="$TAGS --tag ${IMAGE_NAME}:${BASE_TAG}-latest-${ARCH_TAG}"
                            TAGS="$TAGS --tag ghcr.io/pimcore/pimcore:${BASE_TAG}-latest-${ARCH_TAG}"
                        fi
                        # Create tag for major version
                        if [[ $VERSION =~ ^v[0-9]+.[0-9]+$ ]]; then
                            VERSION_MAJOR="${VERSION//.[0-9]/}"
                            TAG_MAJOR="${BASE_TAG}-${VERSION_MAJOR}-${ARCH_TAG}"
                            GHCR_TAG_MAJOR="ghcr.io/pimcore/pimcore:${TAG_MAJOR}"
                            TAGS="$TAGS --tag ${IMAGE_NAME}:${TAG_MAJOR}"
                            TAGS="$TAGS --tag $GHCR_TAG_MAJOR"
                        fi

                        # Build and load image locally
                        docker build --load \
                            --provenance=false \
                            --platform "linux/${ARCH_TAG}" \
                            --target="pimcore_php_$imageVariant" \
                            --build-arg PHP_VERSION="${PHP_VERSION}" \
                            --build-arg DEBIAN_VERSION="${DEBIAN_VERSION}" \
                            --tag "${IMAGE_NAME}:${TAG}" .

                        # Patch OS-level vulnerabilities with Copa
                        echo "Scanning and patching image ${IMAGE_NAME}:${TAG}"
                        trivy image --vuln-type os --ignore-unfixed --format json \
                            -o /tmp/trivy-report.json "${IMAGE_NAME}:${TAG}"

                        if [ -s /tmp/trivy-report.json ] && jq -e '.Results[]? | select(.Vulnerabilities != null and (.Vulnerabilities | length > 0))' /tmp/trivy-report.json > /dev/null 2>&1; then
                            copa patch -i "${IMAGE_NAME}:${TAG}" \
                                -r /tmp/trivy-report.json \
                                -t "${TAG}-patched" \
                                -a tcp://127.0.0.1:8888

                            # Verify the patched image exists
                            if ! docker image inspect "${IMAGE_NAME}:${TAG}-patched" > /dev/null 2>&1; then
                                echo "::error::Patched image not found for ${IMAGE_NAME}:${TAG}"
                                exit 1
                            fi

                            docker rmi "${IMAGE_NAME}:${TAG}"
                            docker tag "${IMAGE_NAME}:${TAG}-patched" "${IMAGE_NAME}:${TAG}"
                            docker rmi "${IMAGE_NAME}:${TAG}-patched"
                            echo "Successfully patched ${IMAGE_NAME}:${TAG}"
                        else
                            echo "No fixable OS vulnerabilities found, skipping Copa patch"
                        fi
                        rm -f /tmp/trivy-report.json

                        # Post-patch vulnerability gate
                        FAIL_SEVERITY="${FAIL_ON_SEVERITY:-CRITICAL}"
                        if [ "$FAIL_SEVERITY" != "NONE" ]; then
                            echo "Running post-patch scan (fail on ${FAIL_SEVERITY}+)"

                            # OS scan
                            trivy image --vuln-type os --ignore-unfixed \
                                --severity "$FAIL_SEVERITY" \
                                --format table \
                                -o /tmp/trivy-os-${TAG}.txt \
                                "${IMAGE_NAME}:${TAG}" || true
                            trivy image --vuln-type os --ignore-unfixed \
                                --exit-code 1 \
                                --severity "$FAIL_SEVERITY" \
                                "${IMAGE_NAME}:${TAG}"

                            # Library scan
                            echo "Running filesystem/library scan (fail on ${FAIL_SEVERITY}+)"
                            trivy image --vuln-type library --ignore-unfixed \
                                --severity "$FAIL_SEVERITY" \
                                --format table \
                                -o /tmp/trivy-lib-${TAG}.txt \
                                "${IMAGE_NAME}:${TAG}" || true
                            trivy image --vuln-type library --ignore-unfixed \
                                --exit-code 1 \
                                --severity "$FAIL_SEVERITY" \
                                "${IMAGE_NAME}:${TAG}"

                            # Attach scan results to GitHub Actions job summary
                            {
                                echo "## Trivy Scan: ${IMAGE_NAME}:${TAG}"
                                echo ""
                                echo "### OS Vulnerabilities (${FAIL_SEVERITY}+)"
                                echo '```'
                                cat /tmp/trivy-os-${TAG}.txt 2>/dev/null || echo "No results"
                                echo '```'
                                echo ""
                                echo "### Library Vulnerabilities (${FAIL_SEVERITY}+)"
                                echo '```'
                                cat /tmp/trivy-lib-${TAG}.txt 2>/dev/null || echo "No results"
                                echo '```'
                                echo ""
                            } >> "$GITHUB_STEP_SUMMARY"
                            rm -f /tmp/trivy-os-${TAG}.txt /tmp/trivy-lib-${TAG}.txt
                        fi

                        # Apply all tags to the (patched) image
                        CLEAN_TAGS_FOR_TAGGING="${TAGS//--tag /}"
                        read -r -a ALL_TAGS <<< "$CLEAN_TAGS_FOR_TAGGING"
                        for additional_tag in "${ALL_TAGS[@]}"; do
                            if [ "$additional_tag" != "${IMAGE_NAME}:${TAG}" ]; then
                                docker tag "${IMAGE_NAME}:${TAG}" "$additional_tag"
                            fi
                        done

                        # Push if publishing
                        if [[ "$PUSH" == "true" ]]; then
                            for additional_tag in "${ALL_TAGS[@]}"; do
                                docker push "$additional_tag"
                            done
                        fi

                        docker inspect ${IMAGE_NAME}:${TAG} || true;

                        # Only aggregate tags if we're publishing
                        if [[ "$PUSH" == "true" ]]; then
                            CLEAN_TAGS="${TAGS//-arm64/}"
                            CLEAN_TAGS="${CLEAN_TAGS//-amd64/}"
                            CLEAN_TAGS="${CLEAN_TAGS//--tag /}"

                            read -r -a TAGS_ARRAY <<< "$CLEAN_TAGS"
                                                  
                            for tag in "${TAGS_ARRAY[@]}"; do
                                echo "Processing tag: $tag"
                                echo "$tag" >> aggregated_tags.txt
                            done
                        fi

                        # Clean up to save disk space
                        docker rmi "${IMAGE_NAME}:${TAG}" || true
                        for additional_tag in "${ALL_TAGS[@]}"; do
                            docker rmi "$additional_tag" 2>/dev/null || true
                        done

                    done

            -   name: Stop buildkit daemon
                if: always()
                run: docker stop buildkitd || true

            -   name: Upload aggregated tags
                if: github.event_name != 'workflow_dispatch' || inputs.publish
                uses: actions/upload-artifact@v7
                with:
                    name: aggregated_tags_${{ matrix.runner }}_${{ matrix.build.tag }}_${{ matrix.build.php }}_${{ matrix.build.distro }}_${{ matrix.build.version-override }}_${{ matrix.build.latest-tag }}
                    path: aggregated_tags.txt
        
    process-tags:
        runs-on: ubuntu-22.04
        needs: build-php
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        steps:
            
            -   name: Login to DockerHub Registry
                run: echo ${{ secrets.DOCKERHUB_PASSWORD }} | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

            -   name: Login to GitHub Container Registry
                run: echo ${{ secrets.IMAGES_REPO_TOKEN }} | docker login ghcr.io -u ${{ secrets.IMAGES_REPO_USERNAME }} --password-stdin

            -   name: Download aggregated tags
                uses: actions/download-artifact@v8
                with:
                    path: artifacts
                
            -   name: Process tags
                run: |
                    find artifacts -type f -name "aggregated_tags.txt" -exec cat {} + > all_aggregated_tags.txt

                    readarray -t TAGS_ARRAY < all_aggregated_tags.txt

                    declare -A UNIQUE_TAGS
                    for tag in "${TAGS_ARRAY[@]}"; do
                        UNIQUE_TAGS["$tag"]=1
                    done

                    for tag in "${!UNIQUE_TAGS[@]}"; do
                    
                        echo "Processing tag: $tag"
                        
                        docker manifest create "$tag" \
                        --amend "${tag}-amd64" \
                        --amend "${tag}-arm64"

                        docker manifest push "$tag"
    
                    done

